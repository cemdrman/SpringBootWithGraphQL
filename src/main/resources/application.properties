spring.application.name=graphql-api

# GraphQL
spring.graphql.http.path=/graphql
spring.graphql.websocket.path=/graphql-ws
spring.graphql.graphiql.enabled=true
spring.graphql.schema.printer.enabled=true

# RabbitMQ (varsayılan olarak kapalı; açmak için APP_MESSAGING_RABBITMQ_ENABLED=true)
app.messaging.rabbitmq.enabled=false
app.messaging.rabbitmq.exchange=bilisimio.exchange
app.messaging.rabbitmq.queue=bilisimio.queue
app.messaging.rabbitmq.routing-key=bilisimio.routingkey
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Actuator
management.endpoints.web.exposure.include=health,info
management.health.rabbit.enabled=${app.messaging.rabbitmq.enabled}
